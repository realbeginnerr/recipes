schema_version: 1
version: '1.1'
snapshot_date: '2026-10-19'
perspective: as-is
scope: 소스 코드 정적 분석. 운영 사이트/배포 규칙/사용자 행동은 미검증.
routing:
  basename: /recipes/
  redirects:
    - path: /about
      target: /
      reason: 이전 소개 주소
    - path: '*'
      target: /
      reason: 별도 404 페이지 없이 홈으로 이동
access_model:
  public: 비회원 및 관리자 모두 페이지 접근 가능. 데이터 공개 범위는 별도 규칙 적용.
  admin: 관리자 인증이 필요한 화면. 화면 접근과 데이터 접근 정책은 별도 확인.
navigation:
  primary:
    - home
    - recipes
    - ingredients
  utility:
    - admin
    - admin-login
  external:
    - name: Contact
      url: '[제출본 생략: 외부 문의 링크]'
      note: 실제 코드의 외부 목적지가 공개 문의 목적에 맞는지 확인 필요
  footer: 저작권 문구만 표시. 탐색 링크 없음
  source_files:
    - src/components/SiteHeader.tsx
    - src/components/SiteFooter.tsx
    - src/components/SiteHeader.css
cross_links:
  - from: home
    to: recipes
    purpose: 이야기 끝 CTA
  - from: ingredients-grid
    to: recipe-detail
    purpose: 관련 레시피 첫 항목
  - from: ingredients-grid
    to: recipes
    purpose: '?ingredient=ID로 관련 레시피 더보기'
  - from: shop
    to: recipe-detail
    purpose: 차 레시피 카드
  - from: recipe-detail
    to: recipe-edit
    purpose: 관리자 수정 버튼
  - from: ingredients-grid
    to: ingredient-edit
    purpose: 관리자 수정 버튼
  - from: recipe-edit
    to: ingredient-picker
    purpose: 재료 선택 공유 모달
  - from: product-edit
    to: product-form
    purpose: 상품 폼 공유
  - from: product-edit
    to: product-preview
    purpose: 고객 미리보기 공유
  - from: product-edit
    to: policy-preview
    purpose: 정책 미리보기 공유
  - from: shop-settings
    to: policy-preview
    purpose: 정책 미리보기 공유
  - from: roulette
    to: recipe-detail
    purpose: 새 탭에서 결과 열기
  - from: product-detail
    to: product-detail
    purpose: 혼합차 구성 상품의 상세 링크
state_inventory:
  - nodes:
      - recipes
      - shop
    states:
      - loading
      - load-error-retry
      - no-results-reset
    source_files:
      - src/pages/RecipePage.tsx
  - nodes:
      - ingredients
    states:
      - inline-load-error-retry
      - empty-or-no-results
    source_files:
      - src/pages/IngredientsPage.tsx
    note: loading 중 visible 0이면 빈 결과 메시지가 나타날 수 있음. 사용자 인지 영향은 검증 필요
  - nodes:
      - recipe-detail
      - product-detail
      - ingredient-edit
    states:
      - loading
      - unavailable
      - error
    source_files:
      - src/pages/RecipeDetailPage.tsx
      - src/pages/ProductDetailPage.tsx
      - src/pages/IngredientEditPage.tsx
  - nodes:
      - roulette
    states:
      - loading
      - error-retry
      - empty
      - spinning
      - selected
    source_files:
      - src/pages/RecipeRoulettePage.tsx
  - nodes:
      - admin-login
    states:
      - auth-pending
      - not-admin
      - provider-error
      - popup-error
    source_files:
      - src/components/AddPageAccessProvider.tsx
      - src/components/AddPagePasswordGate.tsx
  - nodes:
      - recipe-edit
    states:
      - loading
      - not-found
    source_files:
      - src/pages/RecipeManagementPage.tsx
    note: 'load().catch(console.error): 사용자용 로드 실패 안내 부재 가능성'
  - nodes:
      - admin
      - recipe-create
      - ingredient-create
      - ingredient-manage
      - product-create
      - product-edit
      - shop-settings
    states:
      - loading-or-saving
      - form-or-load-error
    source_files:
      - src/pages/AdminPage.tsx
      - src/pages/AddRecipePage.tsx
      - src/pages/AddIngredientPage.tsx
      - src/pages/IngredientManagementPage.tsx
      - src/pages/ProductEditPage.tsx
      - src/pages/ShopSettingsPage.tsx
excluded:
  - source: src/components/RecipeEditModal.tsx
    reason: 정의만 있고 src 내 호출/참조가 없음. 현재 IA의 접근 가능한 독립 화면에서 제외.
  - source: src/components/RecipeTable.tsx
    reason: 비회원 저장 안내 코드가 있지만 현재 마운트 위치는 관리자 전용 편집 라우트. 공개 상세의 모달로 취급하지 않음.
